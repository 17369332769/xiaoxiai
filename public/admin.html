<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小希 · 运营后台</title>
  <style>
    :root { --pink: #ff7597; --bg: #150e22; --panel: #1f1730; --border: #2e2440; --muted: #9a8fb0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; background: var(--bg); color: #ece6f5; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .login-box { max-width: 380px; margin: 80px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #100a1c; color: #fff; font-size: 14px; }
    button { cursor: pointer; border: 1px solid var(--pink); background: rgba(255,117,151,0.15); color: var(--pink); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    button:hover { background: var(--pink); color: #fff; }
    button.ghost { border-color: var(--border); color: var(--muted); background: transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .stat .label { font-size: 12px; color: var(--muted); }
    .stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; color: var(--pink); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    .panel h2 { font-size: 15px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .scroll { overflow-x: auto; max-height: 360px; overflow-y: auto; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.06); }
    .err { color: #ff7597; margin-top: 10px; font-size: 13px; }
    .hide { display: none; }
  </style>
</head>
<body>
  <div id="login" class="login-box">
    <h1 style="margin-top:0;">小希 · 运营后台</h1>
    <p style="color:var(--muted);font-size:13px;">请输入管理员令牌 (ADMIN_TOKEN)。</p>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" />
    <div style="margin-top:14px;"><button onclick="doLogin()">进入后台</button></div>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="dash" class="hide">
    <header>
      <h1>💖 小希运营后台</h1>
      <button class="ghost" onclick="refreshAll()">刷新数据</button>
      <button class="ghost" onclick="logout()">退出</button>
      <span id="onlineNow" class="tag"></span>
    </header>
    <div class="wrap">
      <div id="stats" class="grid"></div>

      <div class="panel">
        <h2>📣 发布运营公告</h2>
        <div class="row">
          <input id="annText" placeholder="公告内容（最多 200 字）" style="flex:1;min-width:240px;" />
          <button onclick="publishAnnouncement()">发布</button>
        </div>
        <div id="annList" class="scroll"></div>
      </div>

      <div class="panel">
        <h2>🧾 最近订单（可退款 / 补单）</h2>
        <div class="row">
          <button class="ghost" onclick="reconcile()">生成对账（近30天）</button>
          <span id="reconcileMsg" style="color:var(--muted);font-size:13px;"></span>
        </div>
        <div class="scroll"><table id="ordersTbl"></table></div>
      </div>

      <div class="panel">
        <h2>👥 最近用户</h2>
        <div class="scroll"><table id="usersTbl"></table></div>
      </div>

      <div class="panel">
        <h2>📊 最近行为事件</h2>
        <div class="scroll"><table id="eventsTbl"></table></div>
      </div>

      <div class="panel">
        <h2>🛡️ 内容安全拦截记录（用户输入拦截 / AI 回复替换）</h2>
        <div class="scroll"><table id="safetyTbl"></table></div>
      </div>

      <div class="panel">
        <h2>🐞 系统异常日志（5xx）</h2>
        <div class="scroll"><table id="logsTbl"></table></div>
      </div>

      <div class="panel">
        <h2>⚙️ 运营配置（改价 / 打赏档 / 任务奖励，保存后下次购买或同步即生效）</h2>
        <div id="configBox" class="scroll"></div>
        <div class="row" style="margin-top:12px;">
          <button onclick="saveConfig()">保存配置</button>
          <span id="configMsg" style="color:var(--muted);font-size:13px;"></span>
        </div>
      </div>

      <div class="panel">
        <h2>🗂️ 目录管理（增删商品 / 任务，保存后用户下次同步即生效）</h2>
        <div id="catalogBox" class="scroll"></div>
        <span id="catalogMsg" style="color:var(--muted);font-size:13px;"></span>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('xxa_admin_token') || '';

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        const err = new Error(data?.error?.message || '请求失败');
        err.code = data?.error?.code;
        throw err;
      }
      return data;
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    async function doLogin() {
      token = document.getElementById('token').value.trim();
      try {
        await api('/api/admin/stats');
        localStorage.setItem('xxa_admin_token', token);
        document.getElementById('login').classList.add('hide');
        document.getElementById('dash').classList.remove('hide');
        refreshAll();
      } catch (e) {
        document.getElementById('loginErr').textContent = e.code === 'ADMIN_DISABLED'
          ? '后台未启用：请在后端设置 ADMIN_TOKEN 环境变量。'
          : '令牌无效，请重试。';
      }
    }

    function logout() {
      localStorage.removeItem('xxa_admin_token');
      location.reload();
    }

    async function refreshAll() {
      try {
        const { stats } = await api('/api/admin/stats');
        document.getElementById('onlineNow').textContent = '当前在线 ' + stats.onlineNow + ' 人';
        const m = stats.milestones || {};
        document.getElementById('stats').innerHTML = [
          ['总用户', stats.totalUsers], ['今日新增', stats.newUsersToday], ['DAU', stats.dau],
          ['次日留存(D1)', (stats.nextDayRetention ?? 0) + '%'], ['活跃回访率', stats.retentionRate + '%'],
          ['付费用户', stats.payingUsers],
          ['付费转化', stats.payConversion + '%'], ['总营收(¥)', stats.totalRevenue], ['ARPPU(¥)', stats.arppu],
          ['首次对话', m.firstChat], ['首次签到', m.firstCheckin], ['首次送礼', m.firstGift], ['首次打赏/充值', m.firstTip],
        ].map(([k, v]) => `<div class="stat"><div class="label">${k}</div><div class="value">${esc(v)}</div></div>`).join('');

        const { broadcasts } = await api('/api/admin/broadcasts');
        document.getElementById('annList').innerHTML = broadcasts.map((b) =>
          `<div class="row"><span class="tag">${esc(b.type)}</span><span style="flex:1">${esc(b.text)}</span>` +
          (b.type === 'announcement' ? `<button class="ghost" onclick="deactivate('${esc(b.id)}')">下架</button>` : '') + `</div>`
        ).join('') || '<div style="color:var(--muted)">暂无</div>';

        const { orders } = await api('/api/admin/orders');
        document.getElementById('ordersTbl').innerHTML =
          '<tr><th>订单号</th><th>用户</th><th>金额</th><th>币</th><th>方式</th><th>状态</th><th>时间</th><th></th></tr>' +
          orders.map((o) => `<tr><td>${esc(o.outTradeNo)}</td><td>${esc(o.userId)}</td><td>¥${esc(o.amount)}</td><td>${esc(o.coins)}</td><td>${esc(o.paymentMethod)}</td><td>${esc(o.status)}</td><td>${esc(o.createdAt)}</td>` +
            `<td>${orderAction(o)}</td></tr>`).join('');

        const { users } = await api('/api/admin/users');
        document.getElementById('usersTbl').innerHTML =
          '<tr><th>ID</th><th>等级</th><th>好感</th><th>币</th><th>连签</th><th>连登</th><th>创建</th></tr>' +
          users.map((u) => `<tr><td>${esc(u.id)}</td><td>${esc(u.level)}</td><td>${esc(u.affection)}</td><td>${esc(u.coins)}</td><td>${esc(u.checkin_streak)}</td><td>${esc(u.login_streak)}</td><td>${esc(u.createdAt)}</td></tr>`).join('');

        const { events } = await api('/api/admin/events');
        document.getElementById('eventsTbl').innerHTML =
          '<tr><th>时间</th><th>用户</th><th>类型</th><th>详情</th></tr>' +
          events.map((e) => `<tr><td>${esc(e.timestamp)}</td><td>${esc(e.user_id)}</td><td>${esc(e.type)}</td><td>${esc(e.payload)}</td></tr>`).join('');

        const { events: safety } = await api('/api/admin/safety-events');
        document.getElementById('safetyTbl').innerHTML =
          '<tr><th>时间</th><th>用户</th><th>位置</th><th>类别</th><th>命中</th><th>动作</th><th>来源</th></tr>' +
          (safety.length
            ? safety.map((e) => `<tr><td>${esc(e.timestamp)}</td><td>${esc(e.userId)}</td><td>${esc(e.scope)}</td><td>${esc(e.category)}</td><td>${esc(e.matched)}</td><td>${esc(e.action)}</td><td>${esc(e.source)}</td></tr>`).join('')
            : '<tr><td colspan="7" style="color:var(--muted)">暂无拦截记录</td></tr>');

        const { logs } = await api('/api/admin/logs');
        document.getElementById('logsTbl').innerHTML =
          '<tr><th>时间</th><th>状态</th><th>错误码</th><th>方法</th><th>路径</th><th>信息</th></tr>' +
          (logs.length
            ? logs.map((l) => `<tr><td>${esc(l.timestamp)}</td><td>${esc(l.status)}</td><td>${esc(l.code)}</td><td>${esc(l.method)}</td><td>${esc(l.path)}</td><td>${esc(l.message)}</td></tr>`).join('')
            : '<tr><td colspan="6" style="color:var(--muted)">暂无异常日志 🎉</td></tr>');

        const { config } = await api('/api/admin/config');
        renderConfig(config);
        renderCatalog(config);
      } catch (e) {
        if (e.code === 'ADMIN_FORBIDDEN') logout();
      }
    }

    // ---- Dynamic catalog CRUD (add / delete food, gifts, tasks) ----
    function catRow(kind, label, id) {
      return `<div class="row" style="gap:8px;margin:2px 0;"><span style="flex:1">${esc(label)}</span>` +
        `<button class="ghost" onclick="delCatalog('${kind}','${esc(id)}')">删除</button></div>`;
    }
    function num(id) { const v = Number(document.getElementById(id).value); return Number.isFinite(v) ? v : 0; }
    function val(id) { return document.getElementById(id).value.trim(); }
    function renderCatalog(cfg) {
      const food = (cfg.food || []).map((i) => catRow('food', `${i.icon || ''} ${esc(i.name)} · ¥${i.cost}（体力+${i.energy} 好感+${i.affection}）`, i.id)).join('');
      const gifts = (cfg.gifts || []).map((i) => catRow('gift', `${i.icon || ''} ${esc(i.name)} · ¥${i.cost}（心情+${i.mood} 好感+${i.affection}）`, i.id)).join('');
      const tasks = [...(cfg.dailyTasks || []), ...(cfg.growthTasks || [])].map((t) => catRow('task', `${esc(t.name)} · 目标${t.target}/奖励${t.reward} [${t.category}]`, t.id)).join('');
      document.getElementById('catalogBox').innerHTML =
        `<div style="margin-bottom:14px;"><div style="color:var(--muted);font-size:12px;margin-bottom:6px;">🍱 喂食</div>${food}
          <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;">
            <input id="f_id" placeholder="id" style="width:84px;"/><input id="f_name" placeholder="名称" style="width:120px;"/>
            <input id="f_cost" type="number" placeholder="价格" style="width:64px;"/><input id="f_energy" type="number" placeholder="体力" style="width:64px;"/>
            <input id="f_aff" type="number" placeholder="好感" style="width:64px;"/><input id="f_icon" placeholder="icon" style="width:54px;"/>
            <input id="f_desc" placeholder="描述" style="width:150px;"/><button onclick="addCatalog('food')">添加/更新</button>
          </div></div>
         <div style="margin-bottom:14px;"><div style="color:var(--muted);font-size:12px;margin-bottom:6px;">🎁 礼物</div>${gifts}
          <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;">
            <input id="g_id" placeholder="id" style="width:84px;"/><input id="g_name" placeholder="名称" style="width:120px;"/>
            <input id="g_cost" type="number" placeholder="价格" style="width:64px;"/><input id="g_mood" type="number" placeholder="心情" style="width:64px;"/>
            <input id="g_aff" type="number" placeholder="好感" style="width:64px;"/><input id="g_icon" placeholder="icon" style="width:54px;"/>
            <input id="g_desc" placeholder="描述" style="width:150px;"/><button onclick="addCatalog('gift')">添加/更新</button>
          </div></div>
         <div><div style="color:var(--muted);font-size:12px;margin-bottom:6px;">📋 任务</div>${tasks}
          <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap;">
            <input id="t_id" placeholder="id" style="width:84px;"/><input id="t_name" placeholder="名称" style="width:150px;"/>
            <input id="t_target" type="number" placeholder="目标" style="width:64px;"/><input id="t_reward" type="number" placeholder="奖励" style="width:64px;"/>
            <select id="t_cat" style="width:90px;"><option value="daily">daily</option><option value="growth">growth</option></select>
            <button onclick="addCatalog('task')">添加/更新</button>
          </div></div>`;
    }
    async function addCatalog(kind) {
      const msg = document.getElementById('catalogMsg');
      let item;
      if (kind === 'food') item = { id: val('f_id'), name: val('f_name'), cost: num('f_cost'), energy: num('f_energy'), affection: num('f_aff'), icon: val('f_icon') || '🍪', desc: val('f_desc') || '美味' };
      else if (kind === 'gift') item = { id: val('g_id'), name: val('g_name'), cost: num('g_cost'), mood: num('g_mood'), affection: num('g_aff'), icon: val('g_icon') || '🎁', desc: val('g_desc') || '心意' };
      else item = { id: val('t_id'), name: val('t_name'), target: num('t_target'), reward: num('t_reward'), category: document.getElementById('t_cat').value };
      try {
        await api('/api/admin/catalog/upsert', { kind, item });
        msg.textContent = `已保存 ${kind}:${item.id}。`;
        refreshAll();
      } catch (e) { msg.textContent = '保存失败：' + e.message; }
    }
    async function delCatalog(kind, id) {
      if (!confirm(`确认删除 ${kind} 「${id}」？用户下次同步后不再显示。`)) return;
      try {
        const { removed } = await api('/api/admin/catalog/delete', { kind, id });
        document.getElementById('catalogMsg').textContent = removed ? `已删除 ${kind}:${id}。` : '未找到该条目。';
        refreshAll();
      } catch (e) { document.getElementById('catalogMsg').textContent = '删除失败：' + e.message; }
    }

    // ---- Runtime config editor (商品价 / 打赏档 / 任务奖励) ----
    function configRow(label, key, value) {
      return `<tr><td>${esc(label)}</td><td><input type="number" min="1" step="1" data-key="${esc(key)}" data-orig="${esc(value)}" value="${esc(value)}" style="width:120px;" /></td></tr>`;
    }
    function renderConfig(cfg) {
      const section = (title, rows) => rows
        ? `<div style="margin-bottom:14px;"><div style="color:var(--muted);font-size:12px;margin-bottom:6px;">${title}</div><table>${rows}</table></div>`
        : '';
      const food = (cfg.food || []).map((i) => configRow(`${i.icon || ''} ${i.name}`, `food:${i.id}:cost`, i.cost)).join('');
      const gifts = (cfg.gifts || []).map((i) => configRow(`${i.icon || ''} ${i.name}`, `gift:${i.id}:cost`, i.cost)).join('');
      const tips = (cfg.tippingTiers || []).map((t) => configRow(`打赏 ¥${t.amount}`, `tippingTier:${t.amount}:coins`, t.coins)).join('');
      const tasks = [...(cfg.dailyTasks || []), ...(cfg.growthTasks || [])].map((t) => configRow(t.name, `task:${t.id}:reward`, t.reward)).join('');
      document.getElementById('configBox').innerHTML =
        section('喂食成本（爱心币）', food) +
        section('礼物成本（爱心币）', gifts) +
        section('打赏档位 · 发放爱心币', tips) +
        section('任务奖励（爱心币）', tasks);
    }
    async function saveConfig() {
      const msg = document.getElementById('configMsg');
      const overrides = {};
      document.querySelectorAll('#configBox input[data-key]').forEach((el) => {
        const v = Number(el.value);
        if (Number.isInteger(v) && v > 0 && String(v) !== String(el.dataset.orig)) {
          overrides[el.dataset.key] = v;
        }
      });
      if (Object.keys(overrides).length === 0) { msg.textContent = '没有需要保存的修改。'; return; }
      try {
        const { applied } = await api('/api/admin/config', { overrides });
        msg.textContent = `已保存 ${Object.keys(applied || {}).length} 项，下次购买/同步即生效。`;
        refreshAll();
      } catch (e) {
        msg.textContent = '保存失败：' + e.message;
      }
    }

    async function publishAnnouncement() {
      const el = document.getElementById('annText');
      if (!el.value.trim()) return;
      await api('/api/admin/announcement', { text: el.value.trim() });
      el.value = '';
      refreshAll();
    }
    async function deactivate(id) { await api('/api/admin/announcement/deactivate', { id }); refreshAll(); }
    async function refund(orderId) {
      if (!confirm('确认对该订单退款？将扣回已发放的爱心币。')) return;
      await api('/api/admin/order/refund', { orderId });
      refreshAll();
    }
    function orderAction(o) {
      if (o.status === 'paid') return `<button class="ghost" onclick="refund('${esc(o.id)}')">退款</button>`;
      if (o.status === 'created' || o.status === 'pending') return `<button class="ghost" onclick="settle('${esc(o.id)}')">补单</button>`;
      return '';
    }
    async function settle(orderId) {
      if (!confirm('确认手动补单（标记为已支付并发放爱心币）？仅在确认用户已实际付款、但回调丢失时使用。')) return;
      const { settled, alreadyPaid } = await api('/api/admin/order/settle', { orderId });
      document.getElementById('reconcileMsg').textContent = settled ? '补单成功，已发放爱心币。' : (alreadyPaid ? '该订单此前已支付，无需补单。' : '订单状态不可补单。');
      refreshAll();
    }
    async function reconcile() {
      const msg = document.getElementById('reconcileMsg');
      try {
        const { report } = await api('/api/admin/orders/reconcile');
        const parts = Object.entries(report.byStatus || {}).map(([k, v]) => `${k}:${v.count}笔/¥${v.amount}`);
        msg.textContent = `近30天 共 ${report.totalOrders} 笔，已支付 ${report.paidCount} 笔 / ¥${report.paidAmount}。${parts.join('，')}`;
      } catch (e) {
        msg.textContent = '对账失败：' + e.message;
      }
    }

    if (token) {
      api('/api/admin/stats').then(() => {
        document.getElementById('login').classList.add('hide');
        document.getElementById('dash').classList.remove('hide');
        refreshAll();
      }).catch(() => { localStorage.removeItem('xxa_admin_token'); });
    }
  </script>
</body>
</html>
